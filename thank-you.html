<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081226"><title>Enquiry received — Velora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center}.thanks{animation:thanksIn .8s cubic-bezier(.22,1,.36,1) both;position:relative;overflow:hidden;width:min(680px,calc(100% - 32px));text-align:center;padding:55px 25px;border:1px solid rgba(200,155,74,.22);background:rgba(255,255,255,.025);box-shadow:0 30px 80px rgba(0,0,0,.25)}.thanks::before{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(200,155,74,.18);border-radius:50%;top:-150px;right:-120px;animation:thanksRing 12s linear infinite}.thanks .mark{font:60px "Playfair Display";animation:markPulse 2.8s ease-in-out infinite;color:var(--gold);margin-bottom:18px}.thanks h1{font-size:clamp(40px,7vw,64px)}.thanks p{color:var(--muted);max-width:500px;margin:18px auto 28px}.thanks .status{font-size:11px;color:#748096;margin-top:15px}@keyframes thanksIn{from{opacity:0;transform:translateY(25px) scale(.98)}to{opacity:1;transform:none}}@keyframes thanksRing{to{transform:rotate(360deg)}}@keyframes markPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){.thanks,.thanks::before,.thanks .mark{animation:none!important}}</style></head><body><main class="thanks"><div class="mark">V</div><span class="eyebrow">VELORA CREATIVE HOUSE</span><h1 id="title">Thank you.</h1><p id="message">Your enquiry has been received. We’ll get back to you shortly.</p><a class="btn filled" href="index.html">Return to Velora <span>↗</span></a><div class="status" id="status"></div></main><script>const p=new URLSearchParams(location.search),s=p.get("status"),msg=p.get("msg");if(s==="queued"){document.getElementById("title").textContent="We received it.";document.getElementById("message").textContent="Your enquiry reached the website, but the mail server needs attention. Please contact Velora directly if you need an immediate response.";document.getElementById("status").textContent="Reference: enquiry received"}else if(s==="error"){document.getElementById("title").textContent="Almost there.";document.getElementById("message").textContent=msg||"Please go back and complete the required fields."}</script></body></html>
